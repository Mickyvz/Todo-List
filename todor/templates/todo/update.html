{% extends 'base.html' %}

{% block content %}
<section class="container-sm">
    <h3 class="text-center mt-3 mb-3"> {% block title %}Editar Tarea{% endblock %}</h3>
    <form action="" method="post">
        <div class="form-group">
            <label for="title">Título</label>
            <input type="text" name="title" id="title" class="form-control" required value="{{ todo.title }}">
        </div>
        <div class="form-group">
            <label for="description">Descripción</label>
            <textarea name="description" id="description" rows="3" class="form-control">{{ todo.description }}</textarea>
        </div>
        <br>
        <div class="form-group">
            <label for="state">Completado</label>
            <input type="checkbox" name="state" id="state" class="form-check-input" {% if todo.state == True %}checked{% endif %}>
        </div>
        <br>
        <div class="text-center">
            <input type="submit" value="Guardar" class="btn btn-primary">
            <a href="{{ url_for('todo.index') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
