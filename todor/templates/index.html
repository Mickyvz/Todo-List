{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
<div class="container-sm text-center mt-5">
    <h1 class="display-4">Bienvenido a nuestra lista de tareas</h1>
    <p class="lead">Organiza tus tareas de manera eficiente y sencilla</p>
    <hr class="my-4">
    <p>¿Tienes una cuenta?</p>
    <div class="d-flex justify-content-center">
        <a class="btn btn-primary mx-2" href="{{ url_for('auth.login') }}" role="button">Iniciar Sesión</a>
        <a class="btn btn-success mx-2" href="{{ url_for('auth.register') }}" role="button">Registrarse</a>
    </div>
</div>
{% endblock %}
